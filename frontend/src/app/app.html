@if (requests.slow()) { <div class="connection-notice" role="status">The server is taking longer than usual. It may be starting up. Please keep this page open; unsaved forms are still here.</div> }
<div class="toast-region" role="status" aria-live="polite">@if(toasts.message()) { <div class="status-toast"><span>{{ toasts.message() }}</span><button type="button" aria-label="Dismiss notification" (click)="toasts.dismiss()">Dismiss</button></div> }</div>
<router-outlet />
